name: Renew monthly budgets

# PRD v2 §8.2: creates a new $0 budget row for every category that had a
# budget the prior month, on the 1st of each month. Supersedes the old
# lazy/reactive rollover (which copied dollar amounts forward on first page
# view) with a deterministic scheduled job. Runs the script directly against
# the database, same precedent as hard-delete-expired-accounts.yml — it only
# needs DATABASE_URL and the repo's code.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL — same value as the backend's DATABASE_URL
#   SECRET_KEY   — same value as the backend's SECRET_KEY (the script imports
#                  app config at startup, which requires this field to be
#                  present, even though the script itself never uses it)

on:
  schedule:
    - cron: "5 0 1 * *" # 00:05 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m scripts.renew_monthly_budgets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
